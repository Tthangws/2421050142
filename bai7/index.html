<!DOCTYPE html>
<html lang="en">

<head>

    <title>Document</title>
    <link rel="stylesheet" href="style.css" type="text/css">
        <style>
        body {
            background-color: #2F2C38;
            color: white;
        }

        .danh-sach-muc{
            list-style:none;
            display:flex;
            gap:10px;
            align-items:center;
        }

        .lien-ket-muc{
            text-decoration:none;
            color:#DBDBDD;
            font-weight:bold;
        }

        header{
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .muc{
            padding:15px;
            border-radius:25px;
        }
        .muc:hover{
            background-color:aqua;
        }

        .logoN{
            width:10%;
        }

        .avata{
            width:80%;
            border-radius:10px;
        }

        .dang-chon{
            background-color:#9d98a3;
        }

        .banner{
           background-color:#e3dfe8; 
           width:90%;
           /* height:50vh; */
           margin:20px auto;
           border-radius:10px;
        }

        .banner-anh{
            width:100%;
            border-radius:10px;
        }

        .danh-sach-the-loai{
            width:95%;
            background-color:#a57ed3;
            height:20vh;
            margin:20px auto;
        }

        .phim{
            display:flex;
            justify-content:space-between;
        }

        .phim-poster{
            width:24%;
            height:15vh;
            border-radius:15px;
            background-color:azure;
        }

        .danh-sach-nhan-vat{
            display:flex;
            justify-content:space-between;
        }

        .nhan-vat{
            width:300px;
            height:300px;
            border-radius:50%;
        }

    </style>
</head>
