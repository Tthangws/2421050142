<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css" type="text/css">
    <style>
        /* loại 2: internal style */
        h2{
            /* color dùng để quy định màu chữ */
            color: red;
        }

        /* id thì dùng # */
        #humg {
            color: orange;
        }
    </style>
</head>
<body>
    <!-- kiểu 1 viết style trong thẻ -->
     <!-- loại 1: inline style -->
     <h1 style="color: blue">HUMG</h1>
     <!--  kiểu 2 -->
     <h2>Trường đại học mỏ địa chất</h2>
     <h3>Lớp phát triển ứng dụng web 03</h3>

     <!-- selector -->
    <!-- c1: dùng tên thẻ -->
    <!--c2: dùng id  -->
     <h2 id="humg">hanoi university of mining and geology </h2>

    <!-- c3: dùng class (viết dấu chấm trc tên class)-->
     <h2 id="tieude" class="tieude">hanoi university of mining and geology </h2>

     <h3 class="tieude2">Lớp phát triển ứng dụng web 03</h3>

</body>
</html>
