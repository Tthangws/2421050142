        // <!-- btvn -->

        // vieets ham tinh diem chu dua tren 3 dau diem (A,B,C)
        // tong = A*0.6 +B*0.5+c*0/1  => diem chu tuong ung

        // bai lam
        function diem(A,B,C){
            var cal = A*0.6+B*0.3+C*0.1;
            var diemChu = "";
            var xepLoai = "";
            var diemHe4 = "";
            if (cal < 0 || cal > 10) {
                document.write("Điểm không hợp lệ!");
            } else if (cal >= 9.0) {
                diemChu = "A+"; diemHe4 = 4.0; xepLoai = "Đạt";
            } else if (cal >= 8.5) { // Tự động hiểu là < 9.0
                diemChu = "A";  diemHe4 = 3.7; xepLoai = "Đạt";
            } else if (cal >= 8.0) {
                diemChu = "B+"; diemHe4 = 3.5; xepLoai = "Đạt";
            } else if (cal >= 7.0) {
                diemChu = "B";  diemHe4 = 3.0; xepLoai = "Đạt";
            } else if (cal >= 6.5) {
                diemChu = "C+"; diemHe4 = 2.5; xepLoai = "Đạt";
            } else if (cal >= 5.5) {
                diemChu = "C";  diemHe4 = 2.0; xepLoai = "Đạt";
            } else if (cal >= 5.0) {
                diemChu = "D+"; diemHe4 = 1.5; xepLoai = "Đạt";
            } else if (cal >= 4.0) {
                diemChu = "D";  diemHe4 = 1.0; xepLoai = "Đạt";
            } else {
                diemChu = "F";  diemHe4 = 0;   xepLoai = "Không đạt";
            }
            return "Điểm hệ 10: "+cal+" || Điểm hệ 4: "+diemHe4+" || Điểm chữ: "+diemChu+" || Xếp loại: "+xepLoai;
        }
        var A = Number(prompt("Nhập điểm A: ","Nhập ở đây!"));
        var B = Number(prompt("Nhập điểm B: ","Nhập ở đây!"));
        var C = Number(prompt("Nhập điểm C: ","Nhập ở đây!"));
        document.write("<br>"+diem(A,B,C));


























    </script>
