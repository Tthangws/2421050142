       function tinhDiem(){
            var A = parseFloat(document.getElementById("diemA").value);
            var B = parseFloat(document.getElementById("diemB").value);
            var C = parseFloat(document.getElementById("diemC").value);

            // document.write("<br>điểm A: "+A);
            // document.write("<br>điểm B: "+B);
            // document.write("<br>điểm C: "+C);

        tinhDiem();

        function diem(A,B,C){
            // var A = document.getElementById("diemA").value;
            // var B = document.getElementById("diemB").value;
            // var C = document.getElementById("diemC").value;

            



            var cal = A*0.6+B*0.3+C*0.1;
            var diemChu = "";
            var xepLoai = "";
            var diemHe4 = "";
            if (cal < 0 || cal > 10) {
                document.write("Điểm không hợp lệ!");
            } else if (cal >= 9.0) {
                diemChu = "A+"; diemHe4 = 4.0; xepLoai = "Đạt";
            } else if (cal >= 8.5) {
                diemChu = "A";  diemHe4 = 3.7; xepLoai = "Đạt";
            } else if (cal >= 8.0) {
                diemChu = "B+"; diemHe4 = 3.5; xepLoai = "Đạt";
            } else if (cal >= 7.0) {
                diemChu = "B";  diemHe4 = 3.0; xepLoai = "Đạt";
            } else if (cal >= 6.5) {
                diemChu = "C+"; diemHe4 = 2.5; xepLoai = "Đạt";
            } else if (cal >= 5.5) {
                diemChu = "C";  diemHe4 = 2.0; xepLoai = "Đạt";
            } else if (cal >= 5.0) {
                diemChu = "D+"; diemHe4 = 1.5; xepLoai = "Đạt";
            } else if (cal >= 4.0) {
                diemChu = "D";  diemHe4 = 1.0; xepLoai = "Đạt";
            } else {
                diemChu = "F";  diemHe4 = 0;   xepLoai = "Không đạt";
            }
            return "Điểm hệ 10: "+cal+" || Điểm hệ 4: "+diemHe4+" || Điểm chữ: "+diemChu+" || Xếp loại: "+xepLoai;
        }

        function tuoi(namsinh){
            var namnay = new Date().getFullYear();
            return namnay-namsinh;
        }
        
        function tinhtuoi(){
